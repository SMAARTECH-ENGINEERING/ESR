version: '3.8'

services:

  # ── ESR Tank Management API ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: esr-tank-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./logs:/app/logs
    networks:
      - esr-network
    depends_on: []
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >
          require('http').get('http://localhost:5000/health', (r) => {
            process.exit(r.statusCode === 200 ? 0 : 1);
          }).on('error', () => process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Redis (uncomment to enable Socket.IO horizontal scaling) ─────────────────
  # redis:
  #   image: redis:7-alpine
  #   container_name: esr-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   command: redis-server --appendonly yes
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - esr-network

networks:
  esr-network:
    driver: bridge

